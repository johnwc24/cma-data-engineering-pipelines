# Config-driven file ingestion. Pick a dataset and platform at run time:
#   --conf dataset=deals-csv,platform=hadoop|gcp|local
# Paths use {root} (input root) and {out} (output root) for that platform, and
# {business_date} for the run date.

defaults {
  platform = "hadoop"
  dq.min-rows = 1
  retry {
    max-attempts = 3
    initial-delay-ms = 5000
  }

  datasets {
    # CSV -> Parquet: booking-system deal extract, re-runnable per business date
    deals-csv {
      source {
        format = "csv"
        path = "{root}/landing/deals/business_date={business_date}"
        options { sep = ",", escape = "\"" }
      }
      schema = "deal_id STRING, deal_version INT, deal_name STRING, borrower_party_id STRING, product_type STRING, deal_role STRING, currency STRING, deal_amount DECIMAL(20,2), bank_share_amount DECIMAL(20,2), trade_date DATE, settlement_date DATE, booking_system STRING, deal_status STRING, last_updated_ts TIMESTAMP"
      required = ["deal_id", "deal_version", "borrower_party_id", "currency", "deal_amount", "trade_date"]
      target {
        format = "parquet"
        path = "{out}/curated/files/deal_parquet"
        mode = "overwrite-partition"
        partition-by = ["business_date"]
      }
      quarantine-path = "{out}/quarantine/files/deals_csv"
    }

    # Excel -> Delta (merge): party reference maintained by the onboarding team in a spreadsheet
    party-excel {
      source {
        format = "excel"
        path = "{root}/landing/party/business_date={business_date}/parties.xlsx"
        sheet = "Parties"
      }
      schema = "party_id STRING, legal_name STRING, lei STRING, country_code STRING, sector STRING, is_active BOOLEAN"
      required = ["party_id", "legal_name"]
      unique-keys = ["party_id"]
      target {
        format = "delta"
        path = "{out}/curated/files/party_delta"
        mode = "merge"
        merge-keys = ["party_id"]
      }
      quarantine-path = "{out}/quarantine/files/party_excel"
    }

    # Avro -> Delta (partition overwrite): FX rates from the market-data vendor
    fx-avro {
      source {
        format = "avro"
        path = "{root}/landing/fx/business_date={business_date}"
      }
      schema = "currency STRING, rate_to_usd DECIMAL(18,8), rate_date DATE"
      required = ["currency", "rate_to_usd", "rate_date"]
      unique-keys = ["currency", "rate_date"]
      target {
        format = "delta"
        path = "{out}/curated/files/fx_rate_delta"
        mode = "overwrite-partition"
        partition-by = ["business_date"]
      }
      quarantine-path = "{out}/quarantine/files/fx_avro"
    }

    # JSON -> Parquet (append): vendor ratings drops, kept as immutable history
    ratings-json {
      source {
        format = "json"
        path = "{root}/landing/ratings/business_date={business_date}"
      }
      schema = "party_id STRING, agency STRING, rating STRING, outlook STRING, rated_on DATE"
      required = ["party_id", "agency", "rating"]
      target {
        format = "parquet"
        path = "{out}/curated/files/rating_parquet"
        mode = "append"
        partition-by = ["business_date"]
      }
      quarantine-path = "{out}/quarantine/files/ratings_json"
    }
  }
}

local {
  platform = "local"
  roots.local = "data/sample"
  outputs.local = "target/local-output"
  retry.initial-delay-ms = 100
}

dev {
  roots.hadoop = "hdfs:///data/cma/dev"
  roots.gcp = "gs://cma-data-dev-lake"
}

uat {
  roots.hadoop = "hdfs:///data/cma/uat"
  roots.gcp = "gs://cma-data-uat-lake"
}

prod {
  roots.hadoop = "hdfs:///data/cma/prod"
  roots.gcp = "gs://cma-data-prod-lake"
  dq.min-rows = 10
}
