# Layering: --conf  >  --config <file>  >  <env> block  >  defaults
defaults {
  source {
    system = "LOANIQ"
    format = "csv"
  }
  dq.min-rows = 1
  recon.amount-tolerance = 0.01
  retry {
    max-attempts = 3
    initial-delay-ms = 5000
  }
}

# Runs on a laptop / CI against data/sample with parquet output
local {
  sink.mode = "files"
  paths {
    landing    = "data/sample/landing/deals"
    parties    = "data/sample/reference/parties.csv"
    fx-rates   = "data/sample/reference/fx_rates.csv"
    curated    = "target/local-output/curated/deal"
    rejects    = "target/local-output/quarantine/deal_reject"
    dq-results = "target/local-output/audit/dq_results"
    run-audit  = "target/local-output/audit/pipeline_run"
  }
  retry.initial-delay-ms = 100
}

dev {
  sink.mode = "hive"
  paths.landing = "hdfs:///data/cma/dev/landing/deals"
  tables {
    parties    = "cma_ref_dev.party"
    fx-rates   = "cma_ref_dev.fx_rate"
    curated    = "cma_curated_dev.deal"
    rejects    = "cma_quarantine_dev.deal_reject"
    dq-results = "cma_audit_dev.dq_results"
    run-audit  = "cma_audit_dev.pipeline_run"
  }
}

uat = ${dev} {
  paths.landing = "hdfs:///data/cma/uat/landing/deals"
  tables {
    parties    = "cma_ref_uat.party"
    fx-rates   = "cma_ref_uat.fx_rate"
    curated    = "cma_curated_uat.deal"
    rejects    = "cma_quarantine_uat.deal_reject"
    dq-results = "cma_audit_uat.dq_results"
    run-audit  = "cma_audit_uat.pipeline_run"
  }
}

prod = ${dev} {
  paths.landing = "hdfs:///data/cma/prod/landing/deals"
  tables {
    parties    = "cma_ref.party"
    fx-rates   = "cma_ref.fx_rate"
    curated    = "cma_curated.deal"
    rejects    = "cma_quarantine.deal_reject"
    dq-results = "cma_audit.dq_results"
    run-audit  = "cma_audit.pipeline_run"
  }
  # Large daily volumes in production; stricter expectation of a non-empty feed
  dq.min-rows = 10
}
