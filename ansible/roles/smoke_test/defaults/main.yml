---
cma_base_dir: /opt/cma
# Business date the dry-run jobs read (defaults to yesterday)
smoke_business_date: "{{ '%Y-%m-%d' | strftime(ansible_date_time.epoch | int - 86400) }}"
streaming_app_name: "cma-deal-stream-hive-{{ cma_env }}"
streaming_job_label: cma-deal-stream-bq
# How stale the last successful batch run / stream batch may be before the smoke test fails
max_batch_age_hours: 30
max_stream_lag_minutes: 15
hive_tables:
  - "cma_curated{{ hive_env_suffix }}.deal"
  - "cma_curated{{ hive_env_suffix }}.deal_intraday"
  - "cma_quarantine{{ hive_env_suffix }}.deal_reject"
  - "cma_audit{{ hive_env_suffix }}.dq_results"
  - "cma_audit{{ hive_env_suffix }}.pipeline_run"
  - "cma_audit{{ hive_env_suffix }}.stream_batch"
bq_tables:
  - cma_staging.deal_stg
  - cma_curated.deal_history
  - cma_curated.deal_current
  - cma_curated.league_table_monthly
  - cma_quarantine.deal_reject
  - cma_audit.dq_results
  - cma_audit.stream_batch
  - cma_audit.sql_assertions
expected_dags:
  - cma_deals_gcp
  - cma_deals_hadoop
  - cma_stream_health
  - cma_hive_to_bq_migration
  - cma_data_products
