# Layering: --conf  >  --config <file>  >  <env> block  >  defaults
defaults {
  source.system = "LOANIQ"
  dq.min-rows = 1
  recon.amount-tolerance = 0.01
  retry {
    max-attempts = 4
    initial-delay-ms = 10000
  }
  bigquery {
    # indirect = stage Parquet in GCS then load job: atomic per partition and cheapest for batch
    write-method = "indirect"
    datasets {
      reference  = "cma_ref"
      staging    = "cma_staging"
      curated    = "cma_curated"
      quarantine = "cma_quarantine"
      audit      = "cma_audit"
    }
  }
  migration {
    # Hive tables to move, and the column used for value reconciliation
    tables = [
      { source = "cma_curated.deal", target = "deal_history_migrated", partition-column = "business_date", amount-column = "deal_amount" }
    ]
    days-back = 0
  }
}

dev {
  gcp.project       = "cma-data-dev"
  gcs.landing       = "gs://cma-data-dev-landing/deals"
  gcs.temp-bucket   = "cma-data-dev-spark-temp"
}

uat {
  gcp.project       = "cma-data-uat"
  gcs.landing       = "gs://cma-data-uat-landing/deals"
  gcs.temp-bucket   = "cma-data-uat-spark-temp"
}

prod {
  gcp.project       = "cma-data-prod"
  gcs.landing       = "gs://cma-data-prod-landing/deals"
  gcs.temp-bucket   = "cma-data-prod-spark-temp"
  dq.min-rows       = 10
}
