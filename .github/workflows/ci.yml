# Continuous integration on every push and pull request.
# Deployments are handled by the Jenkinsfile (approvals, Ansible, rollback); this workflow
# proves the code compiles, the tests pass and the DAGs / playbooks are valid.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  scala:
    name: Maven build & Scala tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build, test and package (all modules)
        run: |
          set -o pipefail
          mvn -B -ntp verify -fae 2>&1 | tee build.log

      - name: Annotate failures
        if: failure()
        run: python3 ci/annotate_failures.py build.log

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "**/target/surefire-reports/*.xml"
          check_name: Scala test results

      - name: Upload job jars
        uses: actions/upload-artifact@v4
        with:
          name: spark-job-jars
          path: "**/target/*-all.jar"
          retention-days: 14

  airflow:
    name: Airflow DAG tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: airflow/requirements-dev.txt

      - name: Install system libraries (Kerberos headers for the HDFS provider)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libkrb5-dev

      - name: Install Airflow (Composer-aligned constraints)
        run: |
          set -o pipefail
          pip install -r airflow/requirements-dev.txt \
            --constraint https://raw.githubusercontent.com/apache/airflow/constraints-2.9.3/constraints-3.11.txt 2>&1 | tee pip.log

      - name: Annotate install failures
        if: failure()
        run: python3 ci/annotate_failures.py pip.log

      - name: Lint
        run: ruff check airflow

      - name: DAG integrity and unit tests
        env:
          CMA_ENV: dev
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
          AIRFLOW__CORE__UNIT_TEST_MODE: "true"
        run: |
          airflow db migrate > /dev/null
          pytest -q airflow/tests bigquery/tests notebooks/tests

  ansible:
    name: Ansible lint & syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible
        run: |
          pip install ansible-core ansible-lint
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Syntax check every environment
        working-directory: ansible
        run: |
          for env in dev uat prod; do
            ansible-playbook -i inventories/$env playbooks/site.yml --syntax-check
            ansible-playbook -i inventories/$env playbooks/rollback.yml --syntax-check
            ansible-playbook -i inventories/$env playbooks/smoke_test.yml --syntax-check
          done

      - name: Lint
        working-directory: ansible
        run: |
          set -o pipefail
          ansible-lint playbooks roles 2>&1 | tee ../lint.log

      - name: Annotate lint failures
        if: failure()
        run: grep -E "^[a-z-]+(\[[a-z-]+\])?:" lint.log | sort | uniq -c | sort -rn | head -30 | sed 's/^/::error title=ansible-lint::/' || true

  local-e2e:
    name: Local end-to-end run + reconciliation notebook
    runs-on: ubuntu-latest
    needs: scala
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the Hadoop batch jar
        run: mvn -B -ntp -pl hadoop-batch -am package -DskipTests

      - name: Install PySpark and papermill
        run: pip install "pyspark==3.5.1" papermill ipykernel pandas pyarrow

      - name: Run the deal pipeline locally with spark-submit
        run: |
          set -o pipefail
          spark-submit --master "local[2]" \
            --driver-java-options "--add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED" \
            --class com.example.cma.hadoop.DealIngestionJob \
            hadoop-batch/target/hadoop-batch-*-all.jar \
            --env local --business-date 2026-10-26 --run-id ci-local 2>&1 | tee e2e.log

      - name: Reconcile with the PySpark notebook
        run: |
          python -m ipykernel install --user --name python3
          papermill notebooks/pipeline_reconciliation.ipynb target/reconciliation-output.ipynb \
            -p PLATFORM local -p REPO_ROOT "$PWD" -p WRITE_RESULTS True 2>&1 | tee -a e2e.log

      - name: Annotate failures
        if: failure()
        run: python3 ci/annotate_failures.py e2e.log

      - name: Upload executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconciliation-notebook
          path: target/reconciliation-output.ipynb
