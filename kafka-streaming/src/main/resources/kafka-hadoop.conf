# Kafka (on-prem) -> Spark on YARN -> Hive
defaults {
  kafka {
    topic = "cma.deal.events"
    dlq-topic = "cma.deal.events.dlq"
    starting-offsets = "earliest"
    max-offsets-per-trigger = 50000
    # Passed through to the Kafka client as kafka.<key>. Secrets come from a JAAS file
    # shipped with --files by Ansible, never from this file.
    options {
      "security.protocol" = "SASL_SSL"
      "sasl.mechanism" = "GSSAPI"
      "sasl.kerberos.service.name" = "kafka"
      "ssl.truststore.location" = "truststore.jks"
      "ssl.truststore.type" = "JKS"
    }
  }
  stream.trigger-seconds = 60
  retry {
    max-attempts = 3
    initial-delay-ms = 5000
  }
}

dev {
  kafka.bootstrap-servers = "kafka-dev-01.example.internal:9093,kafka-dev-02.example.internal:9093"
  stream.checkpoint = "hdfs:///data/cma/dev/checkpoints/deal-stream-hive"
  tables {
    parties      = "cma_ref_dev.party"
    fx-rates     = "cma_ref_dev.fx_rate"
    raw-events   = "cma_raw_dev.deal_event"
    curated      = "cma_curated_dev.deal_intraday"
    rejects      = "cma_quarantine_dev.deal_reject"
    batch-ledger = "cma_audit_dev.stream_batch"
  }
}

uat = ${dev} {
  kafka.bootstrap-servers = "kafka-uat-01.example.internal:9093,kafka-uat-02.example.internal:9093"
  stream.checkpoint = "hdfs:///data/cma/uat/checkpoints/deal-stream-hive"
  tables {
    parties      = "cma_ref_uat.party"
    fx-rates     = "cma_ref_uat.fx_rate"
    raw-events   = "cma_raw_uat.deal_event"
    curated      = "cma_curated_uat.deal_intraday"
    rejects      = "cma_quarantine_uat.deal_reject"
    batch-ledger = "cma_audit_uat.stream_batch"
  }
}

prod = ${dev} {
  kafka.bootstrap-servers = "kafka-prd-01.example.internal:9093,kafka-prd-02.example.internal:9093,kafka-prd-03.example.internal:9093"
  stream.checkpoint = "hdfs:///data/cma/prod/checkpoints/deal-stream-hive"
  stream.trigger-seconds = 30
  tables {
    parties      = "cma_ref.party"
    fx-rates     = "cma_ref.fx_rate"
    raw-events   = "cma_raw.deal_event"
    curated      = "cma_curated.deal_intraday"
    rejects      = "cma_quarantine.deal_reject"
    batch-ledger = "cma_audit.stream_batch"
  }
}
