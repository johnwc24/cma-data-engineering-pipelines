# Google Cloud Managed Service for Apache Kafka -> Spark on Dataproc -> BigQuery
defaults {
  kafka {
    topic = "cma.deal.events"
    dlq-topic = "cma.deal.events.dlq"
    starting-offsets = "earliest"
    max-offsets-per-trigger = 50000
    # Managed Kafka authenticates with the Dataproc service account (no secrets in config).
    # Requires the managed-kafka-auth-login-handler jar on the cluster (installed by Ansible).
    options {
      "security.protocol" = "SASL_SSL"
      "sasl.mechanism" = "OAUTHBEARER"
      "sasl.login.callback.handler.class" = "com.google.cloud.hosted.kafka.auth.GcpLoginCallbackHandler"
      "sasl.jaas.config" = "org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required;"
    }
  }
  stream.trigger-seconds = 30
  retry {
    max-attempts = 4
    initial-delay-ms = 5000
  }
  bigquery {
    # Storage Write API: low-latency appends for streaming
    write-method = "direct"
    datasets {
      raw        = "cma_raw"
      reference  = "cma_ref"
      staging    = "cma_staging"
      curated    = "cma_curated"
      quarantine = "cma_quarantine"
      audit      = "cma_audit"
    }
  }
}

dev {
  gcp.project = "cma-data-dev"
  gcs.temp-bucket = "cma-data-dev-spark-temp"
  kafka.bootstrap-servers = "bootstrap.cma-kafka-dev.europe-west2.managedkafka.cma-data-dev.cloud.goog:9092"
  stream.checkpoint = "gs://cma-data-dev-checkpoints/deal-stream-bq"
}

uat {
  gcp.project = "cma-data-uat"
  gcs.temp-bucket = "cma-data-uat-spark-temp"
  kafka.bootstrap-servers = "bootstrap.cma-kafka-uat.europe-west2.managedkafka.cma-data-uat.cloud.goog:9092"
  stream.checkpoint = "gs://cma-data-uat-checkpoints/deal-stream-bq"
}

prod {
  gcp.project = "cma-data-prod"
  gcs.temp-bucket = "cma-data-prod-spark-temp"
  kafka.bootstrap-servers = "bootstrap.cma-kafka-prod.europe-west2.managedkafka.cma-data-prod.cloud.goog:9092"
  stream.checkpoint = "gs://cma-data-prod-checkpoints/deal-stream-bq"
  stream.trigger-seconds = 15
}
