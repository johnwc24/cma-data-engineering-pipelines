# Data-product jobs. Paths use {root} (input root) and {out} (output root) for the chosen platform.
defaults {
  platform = "hadoop"
  retry {
    max-attempts = 3
    initial-delay-ms = 5000
  }

  # ---------------------------------------------------------------- JdbcIncrementalIngestionJob (--conf source=<name>)
  jdbc-sources {
    party-master {
      url = "jdbc:postgresql://partydb.example.internal:5432/partymaster?ssl=true&sslmode=verify-full"
      table = "public.party"
      key-columns = ["party_id"]
      watermark-column = "updated_at"
      partition-column = "party_sk"     # numeric surrogate key used to split the read
      num-partitions = 8
      fetch-size = 10000
      lookback-minutes = 60             # re-read the last hour to catch late-committing transactions
      user-env = "PARTYDB_USER"         # credentials from the environment / secret manager, never config
      password-file = "/etc/cma/secrets/partydb-password"
      target-path = "{out}/curated/postgres/party"
      watermark-path = "{out}/_watermarks/party-master"
      quarantine-path = "{out}/quarantine/postgres/party"
    }
  }

  # ---------------------------------------------------------------- BreakReconciliationJob
  breaks {
    cma-path = "{out}/curated/deal"
    booking-path = "{root}/landing/booking/business_date={business_date}/positions.csv"
    output-path = "{out}/curated/recon/deal_breaks"
    amount-tolerance = 0.01
    max-break-rate = 0.05               # more than 5% of deals broken fails the run (exit 6)
  }

  # ---------------------------------------------------------------- VendorFeedJob (--conf feed=<name>)
  vendor-feeds {
    agency-ratings {
      vendor = "ExampleRatingsCo"
      format = "csv"
      landing-path = "{root}/landing/vendor/ratings/business_date={business_date}"
      manifest-name = "manifest.json"
      schema = "party_id STRING, agency STRING, rating STRING, outlook STRING, rated_on DATE"
      required = ["party_id", "agency", "rating"]
      key-columns = ["party_id", "agency"]
      min-rows = 1
      intended-use = ["credit-risk", "front-office-analytics"]
      licence {
        id = "LIC-RAT-2026-014"
        expires = "2027-03-31"
        permitted-use = ["credit-risk", "front-office-analytics", "data-science"]
        redistribution = false
      }
      target-path = "{out}/curated/vendor/agency_ratings"
      quarantine-path = "{out}/quarantine/vendor/agency_ratings"
    }
  }

  # ---------------------------------------------------------------- PointInTimeFeaturesJob
  features {
    deal-history-path = "{out}/curated/deal_history"
    ratings-path = "{out}/curated/vendor/agency_ratings"
    output-path = "{out}/features/borrower_pit"
    lookback-days = 365
  }
}

local {
  platform = "local"
  roots.local = "data/sample"
  outputs.local = "target/local-output"
  retry.initial-delay-ms = 100
  breaks.max-break-rate = 1.0           # the sample data has deliberate breaks
}

dev {
  roots.hadoop = "hdfs:///data/cma/dev"
  roots.gcp = "gs://cma-data-dev-lake"
  breaks.max-break-rate = 0.25
}

uat {
  roots.hadoop = "hdfs:///data/cma/uat"
  roots.gcp = "gs://cma-data-uat-lake"
}

prod {
  roots.hadoop = "hdfs:///data/cma/prod"
  roots.gcp = "gs://cma-data-prod-lake"
}
